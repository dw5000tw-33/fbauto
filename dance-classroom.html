<aside><section class="panel"><div class="source-picker"><label for="sourceUrl">影片網址／YouTube 嵌入碼</label><input id="sourceUrl" type="text" value="https://www.youtube.com/watch?v=7Xdfi3qkPEw" placeholder="貼上網址，或 YouTube 提供的完整 iframe 嵌入碼"><div class="controls"><button class="primary" id="loadUrl">載入影片到右側</button><button id="openPipSource">備用：Chrome 子母畫面</button><button id="chooseLocal">選擇電腦影片</button><input id="localFile" type="file" accept="video/*" hidden></div><p id="mediaStatus" role="status"></p></div><div class="video" id="mediaHost"><iframe width="883" height="497" src="https://www.youtube.com/embed/7Xdfi3qkPEw" title="不要生氣~~吳美雲老師讚美操6（備份）" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="video-info">影片位置 <button id="resize">放大右側區域</button><button id="pipGuide">顯示子母畫面步驟</button><p>若播放器無法播放，可<a id="sourceLink" href="https://www.youtube.com/watch?v=7Xdfi3qkPEw" target="_blank" rel="noopener noreferrer">另開原網頁</a>。</p></div></section><div class="notice">預設在右側播放 YouTube，字幕與動作由本頁手動切換。若出現錯誤 153，可使用「備用：Chrome 子母畫面」；選擇備用方式後，請保留 YouTube 分頁。</div></aside></div>
<nav class="controls" aria-label="教學切換"><span class="count" id="count"></span><button id="prev">上一句</button><button class="primary" id="next">下一句</button></nav><p class="help">鍵盤 ← → 切換提示。影片播放與暫停，請使用影片內的控制列。</p>
<details id="editor"><summary>編輯字幕與動作說明</summary><p>看著影片，將目前這句字幕與動作填入下方。可新增多句，再用「上一句／下一句」帶領。</p><label>這句字幕<textarea id="captionInput" placeholder="輸入已核對的歌詞或帶領提示"></textarea></label><label>對應動作<textarea id="actionInput" placeholder="輸入手部動作與方向"></textarea></label><div class="controls"><button class="primary" id="save">套用這一句</button><button id="add">新增一句</button><button id="download">下載編輯後的網頁</button></div><p id="feedback" role="status">修改後請下載網頁，才能保留內容。</p></details>
</main><script id="lessonData" type="application/json">[{"caption": "先看一次示範\n再一起練手部", "action": "先播放右側影片，再跟著帶領者分段練習。"}, {"caption": "一句一句練習", "action": "這裡將放入對應歌詞的手部動作。請先核對影片，再用下方編輯區填入。"}, {"caption": "準備好，一起跟跳！", "action": "將影片移回要練習的段落，播放音樂，跟著示範完成動作。"}]</script>
<script>
const $=id=>document.getElementById(id);let lessons=JSON.parse($('lessonData').textContent),index=0;
function show(){const item=lessons[index];$('caption').textContent=item.caption;$('action').textContent=item.action;$('captionInput').value=item.caption;$('actionInput').value=item.action;$('count').textContent=`第 ${index+1} / ${lessons.length} 句 · 手動切換`;$('prev').disabled=index===0;$('next').disabled=index===lessons.length-1;}
function move(n){index=Math.max(0,Math.min(lessons.length-1,index+n));show()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','BUTTON','SUMMARY'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});
$('save').onclick=()=>{lessons[index]={caption:$('captionInput').value.trim(),action:$('actionInput').value.trim()};show();$('feedback').textContent='已套用。下載編輯後的網頁，即可保留內容。'};
$('add').onclick=()=>{lessons.push({caption:'待填入字幕',action:'待填入對應動作'});index=lessons.length-1;show();$('captionInput').focus()};
$('resize').onclick=()=>{document.body.classList.toggle('video-large');$('resize').textContent=document.body.classList.contains('video-large')?'還原影片大小':'放大影片區'};
let teaching=false,nativeActive=false;
const fullscreenElement=()=>document.fullscreenElement||document.webkitFullscreenElement;
function teachingMode(on){teaching=on;document.body.classList.toggle('teaching',on);$('full').textContent=on?'離開全螢幕教學':'全螢幕教學';$('full').setAttribute('aria-pressed',String(on));$('screenStatus').textContent=on?'教學模式已開啟；按右上角按鈕或 Esc 可離開。':'';}
async function leaveTeaching(){teachingMode(false);if(fullscreenElement()){try{const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);}catch{}}}
$('full').onclick=async()=>{if(teaching||fullscreenElement()){await leaveTeaching();return;}teachingMode(true);const request=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;try{if(!request)throw Error('unsupported');await request.call(document.documentElement);if(!fullscreenElement())throw Error('not active');nativeActive=true;$('screenStatus').textContent='已進入全螢幕；按 Esc 或右上角按鈕離開。';}catch{$('screenStatus').textContent='已切換成放大教學模式。瀏覽器未允許真正全螢幕；Windows 電腦可按 F11 隱藏瀏覽器工具列。';}};
function screenChanged(){if(fullscreenElement()){nativeActive=true;teachingMode(true);}else if(nativeActive){nativeActive=false;teachingMode(false);}}
document.addEventListener('fullscreenchange',screenChanged);document.addEventListener('webkitfullscreenchange',screenChanged);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&teaching)leaveTeaching();});

$('download').onclick=()=>{lessons[index]={caption:$('captionInput').value.trim(),action:$('actionInput').value.trim()};show();const copy=document.documentElement.cloneNode(true);copy.querySelector('body').classList.remove('teaching');copy.querySelector('#full').textContent='全螢幕教學';copy.querySelector('#full').setAttribute('aria-pressed','false');copy.querySelector('#screenStatus').textContent='';copy.querySelector('#sourceUrl').setAttribute('value',$('sourceUrl').value);copy.querySelector('#mediaHost').replaceChildren();copy.querySelector('#mediaStatus').textContent='';copy.querySelector('#lessonData').textContent=JSON.stringify(lessons).replace(/</g,'\\u003c');copy.querySelector('#editor').removeAttribute('open');copy.querySelector('#feedback').textContent='修改後請下載網頁，才能保留內容。';const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='紫彤小組華麗舞蹈沒有之一教室.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('feedback').textContent='已產生下載檔案，請確認瀏覽器完成下載。'};

let objectUrl=null;
function resetMedia(){const v=$('mediaHost').querySelector('video');if(v)v.pause();$('mediaHost').replaceChildren();$('mediaHost').classList.remove('webpage');$('mediaHost').classList.remove('pip-guide');if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}}
function videoElement(src){const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=src;v.addEventListener('error',()=>{$('mediaStatus').textContent='無法播放這個影片。請確認檔案格式或影片網址；MP4（H.264）通常相容性較佳。'});$('mediaHost').append(v);}
function loadSource(){let u;try{let raw=$('sourceUrl').value.trim();if(/^<iframe\b/i.test(raw)){const match=raw.match(/\bsrc\s*=\s*(["'])(.*?)\1/i);if(!match)throw Error();raw=match[2].replace(/&amp;/gi,'&');}u=new URL(raw);if(!['https:','http:'].includes(u.protocol))throw Error();}catch{$('mediaStatus').textContent='請填入完整的 https:// 或 http:// 網址，或含有 src 的 YouTube iframe 嵌入碼。';return;}
const host=u.hostname.toLowerCase();const yt=['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com','youtu.be'].includes(host);let id=null;
if(yt){id=host==='youtu.be'?u.pathname.split('/')[1]:u.searchParams.get('v');if(!id&&/^\/(embed|shorts|live)\//.test(u.pathname))id=u.pathname.split('/')[2];if(!id||! /^[\w-]{11}$/.test(id)){$('mediaStatus').textContent='請貼上單支 YouTube 影片網址（不是頻道或播放清單）。';return;}}
resetMedia();$('sourceLink').hidden=false;$('sourceLink').href=u.href;
if(/\.(mp4|webm|ogv|ogg|mov)$/i.test(u.pathname)){videoElement(u.href);$('mediaStatus').textContent='已載入影片網址，請按播放。';return;}
const frame=document.createElement('iframe');frame.title=yt?'YouTube 示範影片':'自選網頁';frame.referrerPolicy='strict-origin-when-cross-origin';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';frame.setAttribute('frameborder','0');frame.allowFullscreen=true;
if(yt){const embed=new URL('https://www.youtube.com/embed/'+id);if(u.pathname.startsWith('/embed/')){embed.search=u.search;}else{for(const key of ['si','start','end','list','index']){if(u.searchParams.has(key))embed.searchParams.set(key,u.searchParams.get(key));}}frame.src=embed.href;$('mediaStatus').textContent=location.protocol==='file:'?'目前以 file:// 本機檔案開啟。即使使用 YouTube 官方嵌入碼，仍可能因缺少來源識別出現錯誤 153。要使用 YouTube 子視窗，請改由 HTTP／HTTPS 網址開啟本教學頁；或選擇電腦影片。':'已載入 YouTube。若不允許內嵌播放，請另開原網頁或改選電腦影片。';}
else{frame.src=u.href;frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups');$('mediaHost').classList.add('webpage');$('mediaStatus').textContent='已嘗試載入網頁。若顯示空白或拒絕連線，該網站可能禁止嵌入，請按「另開原網頁」。';}
$('mediaHost').append(frame);}
$('loadUrl').onclick=loadSource;$('sourceUrl').addEventListener('keydown',e=>{if(e.key==='Enter')loadSource()});
$('chooseLocal').onclick=()=>{$('localFile').value='';$('localFile').click()};
$('localFile').onchange=()=>{const f=$('localFile').files[0];if(!f)return;if(!f.type.startsWith('video/')&&!/\.(mp4|webm|ogv|ogg|mov|m4v)$/i.test(f.name)){$('mediaStatus').textContent='請選擇影片檔案。';return;}resetMedia();objectUrl=URL.createObjectURL(f);videoElement(objectUrl);$('sourceLink').hidden=true;$('mediaStatus').textContent='已選擇：'+f.name+'。影片只在本機播放，不會上傳；下次開啟網頁需重新選擇。';};
function showPipGuide(){resetMedia();$('mediaHost').classList.add('pip-guide');const title=document.createElement('h2');title.textContent='Chrome 子母畫面放這裡';const steps=document.createElement('ol');for(const text of ['按上方按鈕，在新分頁播放影片。','在 YouTube 影片上按一次右鍵，再按一次右鍵，選「子母畫面」。','回到本教學頁，將懸浮影片拖到右側並調整大小。']){const li=document.createElement('li');li.textContent=text;steps.append(li);}const note=document.createElement('p');note.textContent='這裡是預留位置，影片視窗需由你拖曳，不會自動吸附。';$('mediaHost').append(title);$('mediaHost').append(steps);$('mediaHost').append(note);$('mediaStatus').textContent='Chrome 懸浮子母畫面模式：不載入 YouTube 內嵌播放器。';}
$('pipGuide').onclick=showPipGuide;
$('openPipSource').onclick=()=>{let url;try{let raw=$('sourceUrl').value.trim();if(/^<iframe\b/i.test(raw)){const m=raw.match(/\bsrc\s*=\s*(["'])(.*?)\1/i);if(!m)throw Error();raw=m[2].replace(/&amp;/gi,'&');}url=new URL(raw);if(!['https:','http:'].includes(url.protocol))throw Error();if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(url.hostname)&&/^\/embed\/[\w-]{11}$/.test(url.pathname)){const id=url.pathname.split('/')[2];url=new URL('https://www.youtube.com/watch?v='+id);}}catch{$('mediaStatus').textContent='請先貼上有效的影片網址或 YouTube 嵌入碼。';return;}showPipGuide();$('sourceLink').hidden=false;$('sourceLink').href=url.href;window.open(url.href,'_blank','noopener,noreferrer');$('mediaStatus').textContent='請在新開啟的影片分頁啟用子母畫面，再回到這一頁。如果沒有新分頁，請允許彈出視窗或使用下方原網頁連結。';};
show();if(!$('mediaHost').querySelector('iframe'))loadSource();else $('mediaStatus').textContent=location.protocol==='file:'?'已載入官方嵌入播放器。目前是本機檔案；若出現錯誤 153，請使用 Chrome 子母畫面或改從 HTTP／HTTPS 網址開啟教學頁。':'已載入官方嵌入播放器，請按影片播放鍵。';
</script></body></html>
